# 시놀로지 Container Manager → 프로젝트 → 만들기 에서 이 파일을 쓰면 됩니다.
services:
  unitimes:
    build: .
    image: unitimes:latest
    container_name: unitimes
    restart: unless-stopped
    ports:
      - "3000:3000"          # NAS의 3000번 포트로 접속 (바꾸려면 왼쪽 숫자만)
    volumes:
      - ./data:/data         # 글·사진·백업이 저장되는 곳 — 이 폴더를 Hyper Backup으로 백업하세요
    environment:
      - TZ=Asia/Seoul
